name: CI/CD Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Acessar servidor e realizar Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Define o nome da pasta do projeto no servidor
            PASTA_APP="projeto-painel-infra"
            
            # 2. Atualizar o código na máquina
            # Verifica se o repositório já foi clonado. Se não, clona; se sim, atualiza.
            if [ ! -d "$PASTA_APP" ]; then
              echo "Clonando o repositório pela primeira vez..."
              git clone https://github.com/${{ github.repository }}.git $PASTA_APP
            fi
            
            cd $PASTA_APP
            echo "Baixando as alterações mais recentes..."
            # Força a atualização descartando mudanças locais caso existam
            git fetch --all
            git reset --hard origin/main 
            
            # 3. Construir a nova imagem Docker
            echo "Construindo a nova imagem..."
            docker build -t imagem-painel .
            
            # 4. Derrubar o container antigo e subir o novo
            echo "Parando o container antigo..."
            docker stop container-painel || true
            docker rm container-painel || true
            
            echo "Subindo o novo container na porta 80..."
            docker run -d --restart always --name container-painel -p 80:80 imagem-painel
